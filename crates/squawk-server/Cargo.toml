[package]
name = "squawk-server"
description = "squawk intercom server: hosts the mix engine and serves the browser UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "squawk-server"
path = "src/main.rs"

[dependencies]
squawk-core = { workspace = true }
squawk-engine = { workspace = true }
squawk-ptp = { workspace = true }
squawk-rtp = { workspace = true }
diag = { path = "../diag" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
socket2 = { version = "0.6", features = ["all"] }
http-body-util = "0.1"
