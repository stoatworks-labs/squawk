[workspace]
resolver = "2"
members = [
    "crates/diag",
    "crates/squawk-core",
    "crates/squawk-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
thiserror = "1"
anyhow = "1"

squawk-core = { path = "crates/squawk-core" }
squawk-engine = { path = "crates/squawk-engine" }
